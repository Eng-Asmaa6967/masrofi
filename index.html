<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>مصروفي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--card:#171a22;--card2:#1e222c;--tx:#f3efe4;--mu:#9aa0ad;--gold:#d4af6a;--gold2:#f1d99b;--ok:#4cc38a;--bad:#e5645f;--ln:#2a2f3b;box-sizing:border-box}
@media (prefers-color-scheme:light){:root{--bg:#f6f2e9;--card:#fff;--card2:#faf6ec;--tx:#1d1a14;--mu:#6d6a60;--gold:#a8802f;--gold2:#8a6718;--ln:#e6dfcc}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;max-width:640px;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px calc(150px + env(safe-area-inset-bottom,0px))}
h1{margin:14px 4px 2px;font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);font-size:12px;margin:0 4px 10px}
.hero{border-radius:20px;padding:18px;margin:8px 0;background:linear-gradient(135deg,#2a2314,#171a22);border:1px solid var(--gold);text-align:center;color:#f3efe4}
.hero span{font-size:12px;color:#c9c2ae}.hero b{display:block;font-size:30px;color:var(--gold2);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.st{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 6px;text-align:center}
.st b{display:block;font-size:14px}.st span{font-size:11px;color:var(--mu)}
h3{margin:18px 4px 6px;font-size:15px;color:var(--gold)}
.it{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:7px 0;display:flex;align-items:center;gap:10px}
.it>div:first-child{flex:1;min-width:0}.it small{display:block;color:var(--mu);font-size:12px}
.it.paid{opacity:.5}.it.paid b{text-decoration:line-through}
.am{font-weight:800;white-space:nowrap}.am.loan{color:var(--gold)}.am.in{color:var(--ok)}.am.buy{color:var(--bad)}
.ac{display:flex;gap:6px}.ac button{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:var(--card2);color:var(--tx);font-size:15px}
.grp{background:var(--card);border:1px solid var(--ln);border-radius:16px;margin:9px 0;overflow:hidden}
.gh{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1a1408;background:linear-gradient(135deg,var(--gold2),var(--gold));flex:none}
.gh .n{flex:1;font-weight:700}.gh small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.gb{padding:0 10px 8px;border-top:1px solid var(--ln)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{max-width:640px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{border:0;background:none;color:var(--mu);font:700 11px Cairo,Tahoma;padding:6px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--gold);background:rgba(212,175,106,.12)}nav button.on i{filter:none;opacity:1}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;width:56px;height:56px;border-radius:50%;font-size:28px;border:0;color:#1a1408;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--gold);max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:18px;color:var(--gold)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--card2);color:var(--tx);font:600 15px Cairo,Tahoma;color-scheme:light dark}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seg button{padding:10px 4px;border-radius:12px;border:1px solid var(--ln);background:var(--card2);color:var(--mu);font:700 13px Cairo}
.seg button.on{color:#1a1408;background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent}
.row{display:flex;gap:8px;margin-top:16px}.btn{flex:1;border:0;border-radius:12px;padding:12px;font:700 15px Cairo,Tahoma;color:#1a1408;background:linear-gradient(135deg,var(--gold2),var(--gold))}.btn.g{flex:0 0 90px;background:var(--card2);color:var(--tx);border:1px solid var(--ln)}
</style>
</head>
<body>
<h1>◆ مصروفي</h1><div class="sub" id="today"></div>
<div id="main"></div>
<button class="fab" id="fab" aria-label="إضافة">+</button>
<nav><div id="nav"></div></nav>

<div class="ov" id="ov"><div class="sheet">
<h2>إضافة حركة</h2>
<div class="seg" id="seg"><button data-t="loan">🤝 سلفة</button><button data-t="in">💰 دخل</button><button data-t="buy">🛒 مشتريات</button></div>
<label>المبلغ (ج.م)</label><input id="a" type="number" inputmode="decimal">
<label id="lw">اسم الشخص</label><input id="w">
<label>السبب / البيان</label><input id="y">
<label>التاريخ</label><input id="d" type="date">
<div class="row"><button class="btn" id="sv">حفظ</button><button class="btn g" id="cx">إلغاء</button></div>
</div></div>

<script>
var K='expenses_v1',D=[],tab='home',T0='loan',op={};
try{var r=localStorage.getItem(K);if(r)D=JSON.parse(r)}catch(x){}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(x){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fm(n){return Number(n||0).toLocaleString('ar-EG')+' ج'}
function fd(s){return new Date(s).toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'})}
function sum(t,f){return D.filter(function(x){return x.t==t&&(!f||f(x))}).reduce(function(a,x){return a+x.a},0)}
var TABS=[['home','🏠','الرئيسية'],['loan','🤝','السلف'],['in','💰','الدخل'],['buy','🛒','المشتريات']],IC={loan:'🤝',in:'💰',buy:'🛒'};
function row(x){return '<div class="it'+(x.p?' paid':'')+'"><div><b>'+esc(x.why||'—')+'</b><small>'+(x.who?esc(x.who)+' · ':'')+fd(x.dt)+(x.p?' · تم السداد':'')+'</small></div><div class="am '+x.t+'">'+fm(x.a)+'</div><div class="ac">'+(x.t=='loan'?'<button onclick="tg(\''+x.id+'\')">'+(x.p?'↩':'✓')+'</button>':'')+'<button onclick="dl(\''+x.id+'\')">🗑</button></div></div>'}
function sorted(l){return l.slice().sort(function(a,b){return a.dt<b.dt?1:a.dt>b.dt?-1:b.id>a.id?1:-1})}
function render(){
  $('today').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('nav').innerHTML=TABS.map(function(t){return '<button class="'+(tab==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><i>'+t[1]+'</i>'+t[2]+'</button>'}).join('');
  var h='',ln=sum('loan',function(x){return !x.p}),inc=sum('in'),by=sum('buy');
  if(tab=='home'){
    h='<div class="hero"><span>الصافي المتاح (دخل − مشتريات − سلف لم تُسدد)</span><b>'+fm(inc-by-ln)+'</b></div><div class="grid"><div class="st"><b style="color:var(--gold)">'+fm(ln)+'</b><span>سلف عند الناس</span></div><div class="st"><b style="color:var(--ok)">'+fm(inc)+'</b><span>إجمالي الدخل</span></div><div class="st"><b style="color:var(--bad)">'+fm(by)+'</b><span>إجمالي المشتريات</span></div></div><h3>آخر الحركات</h3>';
    h+=D.length?sorted(D).slice(0,8).map(function(x){return row(x).replace('<b>','<b>'+IC[x.t]+' ')}).join(''):'<div class="empty">لا توجد حركات بعد<br>اضغط + للإضافة</div>';
  }else if(tab=='loan'){
    var g={};D.filter(function(x){return x.t=='loan'}).forEach(function(x){var n=x.who||'بدون اسم';(g[n]=g[n]||[]).push(x)});
    var names=Object.keys(g).sort(function(a,b){return un(g[b])-un(g[a])});
    h='<div class="hero"><span>إجمالي السلف عند الناس</span><b>'+fm(ln)+'</b></div>';
    h+=names.length?names.map(function(n){var o=op[n];return '<div class="grp"><div class="gh" onclick="tp(this.dataset.n)" data-n="'+esc(n)+'"><div class="av">'+esc(n.charAt(0))+'</div><div class="n">'+esc(n)+'<small>'+g[n].length+' حركة</small></div><div class="am loan">'+fm(un(g[n]))+'</div><span>'+(o?'▲':'▼')+'</span></div>'+(o?'<div class="gb">'+sorted(g[n]).map(row).join('')+'</div>':'')+'</div>'}).join(''):'<div class="empty">لا توجد سلف مسجلة</div>';
  }else{
    var l=D.filter(function(x){return x.t==tab});
    h='<div class="hero"><span>'+(tab=='in'?'إجمالي الدخل':'إجمالي المشتريات')+'</span><b>'+fm(tab=='in'?inc:by)+'</b></div>'+(l.length?sorted(l).map(row).join(''):'<div class="empty">لا توجد حركات</div>');
  }
  $('main').innerHTML=h;
}
function un(l){return l.reduce(function(a,x){return a+(x.p?0:x.a)},0)}
window.go=function(t){tab=t;window.scrollTo(0,0);render()};
window.tp=function(n){op[n]=!op[n];render()};
window.tg=function(id){D.forEach(function(x){if(x.id==id)x.p=x.p?0:1});save();render()};
window.dl=function(id){if(!confirm('حذف هذه الحركة؟'))return;D=D.filter(function(x){return x.id!=id});save();render()};
function seg(t){T0=t;document.querySelectorAll('#seg button').forEach(function(b){b.classList.toggle('on',b.dataset.t==t)});$('lw').textContent=t=='loan'?'اسم الشخص':t=='in'?'مصدر الدخل (اختياري)':'المكان (اختياري)'}
document.querySelectorAll('#seg button').forEach(function(b){b.onclick=function(){seg(b.dataset.t)}});
$('fab').onclick=function(){seg(tab=='home'?'loan':tab);$('a').value='';$('w').value='';$('y').value='';$('d').value=new Date().toISOString().slice(0,10);$('ov').classList.add('on')};
$('cx').onclick=function(){$('ov').classList.remove('on')};
$('d').onclick=function(){try{this.showPicker()}catch(x){}};
$('sv').onclick=function(){
  var a=+$('a').value,w=$('w').value.trim();
  if(!(a>0)){alert('اكتب المبلغ');return}
  if(T0=='loan'&&!w){alert('اكتب اسم الشخص');return}
  D.push({id:'x'+Date.now(),t:T0,a:a,who:w,why:$('y').value.trim(),dt:$('d').value||new Date().toISOString().slice(0,10),p:0});
  save();$('ov').classList.remove('on');render();
};
render();
</script>
</body>
</html>
